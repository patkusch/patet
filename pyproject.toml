[project]
name = "patet"
version = "0.1.0"
description = "See what an anonymous visitor can read from your own Supabase-backed app, without reading a single row."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["supabase", "row-level-security", "rls", "postgrest", "security", "vibe-coding", "lovable", "audit"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
patet = "patet.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/patkusch/patet"
Issues = "https://github.com/patkusch/patet/issues"
Changelog = "https://github.com/patkusch/patet/blob/main/CHANGELOG.md"
