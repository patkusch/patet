name: patet scan
description: Fail the build when a Supabase server key ends up in your website's built files.
branding:
  icon: unlock
  color: red
inputs:
  path:
    description: The build folder to read, such as dist or build
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
      run: |
        python -m pip install -q "${{ github.action_path }}"
        patet scan "$SCAN_PATH"
